version: 2
updates:
  # Minor and patch updates are grouped into a single PR per ecosystem, so
  # there is only one lockfile change to merge and PRs can't conflict with
  # each other. Major updates (which may need code changes) still get their
  # own PR each, so they can be reviewed and tested individually.
  - package-ecosystem: "bun"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "deno"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
