version: 2
updates:
  # Every ecosystem gets exactly ONE grouped PR containing all of its updates
  # (major, minor and patch). Each PR only touches its own folder's manifest
  # and lockfile, so the PRs never conflict with each other and can be merged
  # into develop in any order with a single click.
  - package-ecosystem: "bun"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native Go port) has no JavaScript API, which
      # SvelteKit 3 and svelte-check need (peer dependency: typescript ^6).
      # The build fails with "Cannot read properties of undefined
      # (reading 'readFile')". Remove this once SvelteKit supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Dependabot only bumps the entries listed in backend/deno.json; packages
  # pinned only transitively in deno.lock are covered by the image scan
  # workflow (.github/workflows/image-scan.yml).
  - package-ecosystem: "deno"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      backend:
        patterns: ["*"]

  # Base images plus the Deno and Bun binaries. An image is only tracked when
  # it appears in a `FROM` line, not in an inline `COPY --from=image:tag`.
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker:
        patterns: ["*"]

  # Actions used in .github/workflows (also keeps SHA-pinned actions current)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
