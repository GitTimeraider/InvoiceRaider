version: 2
updates:
  # Every ecosystem gets exactly ONE grouped PR containing all of its updates
  # (major, minor and patch). Each PR only touches its own folder's manifest
  # and lockfile, so the PRs never conflict with each other and can be merged
  # into develop in any order with a single click.
  - package-ecosystem: "bun"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native Go port) has no JavaScript API, which
      # SvelteKit 3 and svelte-check need (peer dependency: typescript ^6).
      # The build fails with "Cannot read properties of undefined
      # (reading 'readFile')". Remove this once SvelteKit supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "deno"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker:
        patterns: ["*"]
