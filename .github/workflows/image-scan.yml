name: Scan Docker Image

# Scans the published image for vulnerable OS packages, binaries (e.g. the
# Deno runtime) and transitive dependencies that Dependabot cannot see.
# Findings show up under the repository's Security > Code scanning tab.

on:
  workflow_dispatch:
  schedule:
    # Every Monday 05:23 UTC, so new CVEs in an unchanged image are caught too.
    - cron: "23 5 * * 1"
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  scan:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [develop, latest]
    steps:
      - name: Lowercase repository
        id: repo
        shell: bash
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}:${{ matrix.tag }}
          format: sarif
          output: trivy-${{ matrix.tag }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.tag)) != ''
        with:
          sarif_file: trivy-${{ matrix.tag }}.sarif
          category: trivy-${{ matrix.tag }}
