name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths-ignore:
      - ".github/dependabot.yml"
      - "README.md"
      - "**/README.md"
      - "**/*.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - ".github/dependabot.yml"
      - "README.md"
      - "**/README.md"
      - "**/*.md"
  release:
    types: [released]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # PRs only verify that the image builds; everything else publishes it.
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  # Each architecture is built natively on its own runner, in parallel.
  # (Emulating arm64 with QEMU on an x86 runner made the build ~4x slower.)
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        id: prep
        shell: bash
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          platform='${{ matrix.platform }}'
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (labels)
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the single-platform image by digest only (no tag); the merge
      # job below combines both digests into the tagged multi-platform image.
      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ steps.prep.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.pair }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.prep.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-architecture images into one tagged multi-platform image.
  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        id: prep
        shell: bash
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Generate docker image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Create and push multi-platform image
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ -z "$tags" ]; then echo "No tags generated for this ref"; exit 1; fi
          docker buildx imagetools create $tags \
            $(printf '${{ steps.prep.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ steps.prep.outputs.image }}:${{ steps.metadata.outputs.version }}"
